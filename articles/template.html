<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ここにタイトルを入力 -->
<title>記事タイトル — 触形プロジェクト</title>
<style>
  :root { --blue: #1A5276; --gold: #B7950B; --light: #F4F6F7; --dark: #2C3E50; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: var(--dark); line-height: 1.7; }
  .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  header { background: var(--blue); color: #fff; padding: 30px 0 20px; text-align: center; }
  header h1 { font-size: 1.5em; margin-bottom: 6px; }
  header .date { font-size: 0.9em; opacity: 0.8; }
  nav.breadcrumb { padding: 10px 0; font-size: 0.85em; }
  nav.breadcrumb a { color: var(--blue); }
  section { padding: 20px 0; }
  h2 { color: var(--blue); font-size: 1.2em; margin: 20px 0 10px; border-left: 4px solid var(--gold); padding-left: 10px; }
  p { margin-bottom: 10px; font-size: 0.95em; }
  footer { text-align: center; padding: 20px 0; font-size: 0.8em; color: #888; border-top: 1px solid #ddd; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <div class="container">
    <!-- ここにタイトルを入力 -->
    <h1>記事タイトル</h1>
    <!-- ここに日付を入力 -->
    <div class="date">2026年XX月XX日</div>
  </div>
</header>
<div class="container">
  <nav class="breadcrumb"><a href="../index.html">トップ</a> &gt; 記事タイトル</nav>
  <section>
    <!-- ここに本文を入力 -->
    <p>本文をここに書きます。</p>

    <h2>見出し</h2>
    <p>見出しごとに内容を記述できます。</p>
  </section>
</div>
<footer>触形プロジェクト — 筑波技術大学</footer>
</body>
</html>
